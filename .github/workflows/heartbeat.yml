name: Heartbeat
on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  heartbeat:
    name: Write freshness heartbeat
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Write and commit heartbeat
        run: |
          mkdir -p history
          echo "lastUpdated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > history/heartbeat.yml
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add history/heartbeat.yml
          git commit -m ":heartbeat: Heartbeat [skip ci] [upptime]"
          git push
