name: Keepalive
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    name: Prevent scheduled workflow disablement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable all workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(ls .github/workflows/*.yml); do
            gh workflow enable "$(basename "$f")" || true
          done
