name: Keepalive
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  keepalive:
    name: Prevent scheduled workflow disablement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable all workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for f in .github/workflows/*.yml; do
            if ! out="$(gh workflow enable "$(basename "$f")" 2>&1)"; then
              if echo "$out" | grep -Eqi 'already enabled|is not disabled'; then
                continue
              fi
              echo "::error::enable failed for $f: $out"
              failed=1
            fi
          done
          exit "$failed"
